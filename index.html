<!DOCTYPE html>
<html>
<head>
<title>ComicCraft</title>
<style>
body{font-family:Arial;background:#f4f0ff;padding:40px}
.box{max-width:650px;margin:auto;background:white;padding:30px;border-radius:18px;box-shadow:0 5px 25px #bbb}
input,select,textarea{width:100%;padding:12px;margin:8px 0 18px;box-sizing:border-box}
button{background:#6c3cff;color:white;border:0;padding:14px 25px;border-radius:10px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h1>🎨 ComicCraft</h1>
<p>Create your own AI-powered comic.</p>
<form action="/generate" method="post">
<label>Story Prompt</label>
<textarea name="story_prompt" required placeholder="A brave girl explores a magical forest"></textarea>
<label>Main Character Name</label>
<input name="character_name" required placeholder="Maya">
<label>Setting</label>
<select name="setting"><option>Forest</option><option>School</option><option>City</option><option>Space</option></select>
<label>Story Tone</label>
<select name="tone"><option>Funny</option><option>Dramatic</option><option>Adventure</option><option>Poetic</option></select>
<label>Art Style</label>
<select name="art_style"><option>Anime</option><option>Comic book</option><option>Pixel art</option><option>Realistic</option></select>
<button type="submit">✨ Generate Comic</button>
</form>
</div>
</body>
</html>
