<!DOCTYPE html>
<html><head><title>Comic Preview</title>
<style>body{font-family:Arial;background:#f4f0ff;padding:30px}.panel{max-width:800px;margin:25px auto;background:white;padding:25px;border-radius:18px}.panel img{max-width:100%;border-radius:10px}a{display:inline-block;background:#6c3cff;color:white;padding:12px 20px;border-radius:8px;text-decoration:none}</style>
</head><body>
<h1 style="text-align:center">📖 Your Comic</h1>
{% for panel in layout %}
<div class="panel">
<h2>Panel {{ panel.panel_number }}: {{ panel.title }}</h2>
<img src="{{ panel.image_path }}">
<p><i>{{ panel.scene_description }}</i></p>
<p>{{ panel.text }}</p>
</div>
{% endfor %}
<div style="text-align:center"><a href="{{ pdf_path }}">⬇ Download Comic PDF</a><br><br><a href="/">Create Another Comic</a></div>
</body></html>
